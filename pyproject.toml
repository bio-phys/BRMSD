[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BRMSD"
version = "1.0.0"
description = "Maximum-entropy RMSD alignment, smoothing, and clustering for molecular dynamics trajectories"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Saumyak Mukherjee", email = "saumyak.mukherjee@biophys.mpg.de" },
    { name = "Gerhard Hummer", email = "gerhard.hummer@biophys.mpg.de" },
]
keywords = [
    "molecular dynamics",
    "structural biology",
    "RMSD",
    "maximum entropy",
    "clustering",
    "trajectory analysis",
    "alignment",
    "trajectory smoothing"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "MDAnalysis>=2.0",
    "joblib>=1.1",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/chemgame/BRMSD"
Issues   = "https://github.com/chemgame/BRMSD/issues"

[project.scripts]
BRMSD = "BRMSD.cli:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["BRMSD*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
